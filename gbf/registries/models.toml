notes = "Default detector of sn-gamestate (yolo_ultralytics). It is also the source of M1's ball input: ball_raw.jsonl (per-frame COCO 'sports ball' candidates, docs/design/m1-highlights.md) comes from YOLO11m with its COCO-pretrained weights, run by a script outside this repository and outside plugin-sngs; no gbf plugin hosts it yet. The ball-receipt.json kept next to that file records the file's sha256 (not the script's or the weights'), declares AGPL-3.0-only and the tags agpl_network_source (this entry's) and no_share (the clip's): python -m gbf highlights refuses the input unless --allow-license accepts AGPL-3.0-only, and carries both tags into run.json. A ball file without that receipt adds only no_share and its licence goes unchecked, so the receipt has to travel with the file. Never run server side; static precomputed results may be published (AGPL-3.0 section 13). The vendor's reading is wider than the AGPL text (whole project, trained weights, and SaaS back ends need an Enterprise licence)."

