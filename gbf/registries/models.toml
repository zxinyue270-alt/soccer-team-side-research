# Model and component registry (ADR 0001).
# Validated by src/gbf/contracts/schemas/registry_models.schema.json against the dict
# that tomllib.load returns.
#
# One entry per model, weight file or third-party component the project plan mentions:
# where it comes from, the licences of its code and weights, the restriction tags its
# outputs carry (ADR 0002), and where it may run. Gate G3 (P0) fails on imports in src/
# and tests/, and on dependencies in pyproject.toml and uv.lock, of the module and
# distribution names that src/gbf/gate/imports.py lists by registry id (REGISTRY_BANS,
# written by hand) for every entry whose status is blocked, research_only or
# plugin_only, and it fails when such an entry has no row there. P5 adds pip-licenses,
# REUSE and generated notices.
#
# Conventions
# - Dates are quoted "YYYY-MM-DD" strings so the dict validates as JSON.
# - Licences are SPDX expressions or LicenseRef-* ids. NONE = upstream declares no
#   licence (all rights reserved by default); NOASSERTION = not verified;
#   NOT_APPLICABLE = the component has no such part (for example no weights).
#   GPL texts without an "or later" notice are recorded as -only (conservative).
# - status
#     planned        intended for use; no open licence question.
#     experimental   off public default paths until an open question (usually the
#                    licences of the training data) is resolved. It may carry
#                    research_nc; only core_exception lets the core run it.
#     research_only  runs only in plugin-research-nc; outputs carry research_nc; never
#                    part of any distribution.
#     blocked        never used: no code, no weights, no import, no dependency.
#     plugin_only    runs only out of process in the named host; the core never imports it.
# - allowed_in_core: the licences of code, weights and required dependencies allow the
#   MIT core (or its permissive perception extra) to import or ship the component, or
#   core_exception records why the core runs it anyway.
# - core_exception: only on an experimental entry the core runs although its licence
#   question is open: the dated ADR 0001 amendment that allows it. Its restrictions
#   reach every output of a run that uses it.
# - default_enabled: runs without an extra opt-in once its host is installed and, for
#   non-permissive licences, allowed with --allow-license (ADR 0001).
# - plugin: none | perception-extra | plugin-sngs | plugin-sam3d | plugin-nbjw |
#   plugin-research-nc. none = no plugin runs it (the core does, it is tooling, or it is
#   blocked). perception-extra is the optional permissive (MIT/Apache) perception stack
#   planned for P5, with its own lock file and CI.
# - verified_url / verified_on: the primary source read for the licence facts, and when.
#   Facts dated 2026-10-21 come from the project's read-only research of that day and
#   the second check in plan appendix B; "not re-checked" marks reviewer facts that
#   appendix B did not re-read.
#
# Licence statements are engineering judgements, not legal advice.

schema_version = 1

