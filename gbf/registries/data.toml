# Data rights registry (ADR 0002).
# Validated by src/gbf/contracts/schemas/registry_data.schema.json against the dict that
# tomllib.load returns.
#
# For every dataset the project uses, considers or has rejected: where the permission
# comes from (rights_source), the licence label, the restriction tags every per-item
# derivative inherits, the uses the terms allow, whether aggregate results may be
# published, and when and where those facts were verified. Upload, publish and deploy
# tools consult this file; the gate blocks entries whose status is blocked or rejected.
#
# Conventions
# - Dates are quoted "YYYY-MM-DD" strings so the dict validates as JSON.
# - allowed_uses lists what the terms allow for this project; anything absent is not
#   allowed. Vocabulary: local_processing, cloud_processing, evaluation, fitting,
#   smoke_testing, publish_aggregates, publish_analysis, publish_media, redistribute,
#   commercial, third_party_services (defined in the schema).
# - aggregate_publication: allowed | not_allowed | unverified. Aggregates computed from
#   several datasets (tag derived_aggregate) are released only when every source says
#   "allowed".
# - A licence label shown by a hosting platform is recorded, but it is not a rights
#   source by itself (see the Roboflow entry).
# - Clauses are paraphrases for orientation, not the terms: read the terms themselves
#   before accepting them. Applications and their dates live in docs/data-access.md.
# - Facts dated 2026-10-21 come from the project's read-only research of that day and
#   plan appendix B; "not re-checked" marks reviewer facts appendix B did not re-read.
#
# Engineering judgement, not legal advice.

schema_version = 1

[[datasets]]
id = "statsbomb-open-data"
name = "StatsBomb Open Data (hudl/open-data)"
kind = "events"
status = "planned"
acquisition = "pinned_download"
license = "LicenseRef-StatsBomb-Public-Data-User-Agreement"
rights_source = "StatsBomb Public Data User Agreement (version dated 2023-09-08; LICENSE.pdf in hudl/open-data), accepted by each user who registers with StatsBomb. gbf holds no separate licence. Clause texts were read by reviewer 3 and not re-checked in appendix B."
restrictions = ["no_share", "non_commercial", "statsbomb_logo"]
allowed_uses = ["local_processing", "evaluation", "fitting", "publish_analysis", "publish_aggregates"]
aggregate_publication = "allowed"
committable = false
attribution = "Data: StatsBomb. Every published analysis shows the StatsBomb logo (agreement clause 1.4)."
pins = "src/gbf/events/pins.toml"
subset = ["Match 3754079: Manchester City 6-1 Newcastle United, Premier League 2015/16, 2015-10-03 (3,448 events: 986 passes, 29 shots; xG 3.90 vs 1.26). It is the SoccerNet game england_epl/2015-2016/2015-10-03 - 17-00 Manchester City 6 - 1 Newcastle Utd."]
clauses = [
  { ref = "1.2.1", summary = "No editing, distributing or copying the data, or making it available to any third party in any way.", handling = "Runtime download only (pins.toml, hash-checked, written under DATA_ROOT); raw JSON and evidence stores are never committed, never uploaded to cloud services, and not sent to third-party LLM or TTS services until clarified (tag no_share)." },
  { ref = "1.2.2", summary = "No commercial exploitation of the data or of analyses derived from it.", handling = "Tag non_commercial: commercial channels refuse anything derived from it." },
  { ref = "1.4", summary = "Published analyses must carry the StatsBomb logo.", handling = "Tag statsbomb_logo: publish tools add the logo automatically." },
  { ref = "2.2", summary = "Users register with StatsBomb before using the data.", handling = "Each user registers and accepts the agreement personally; python -m gbf fetch asks for explicit acceptance; tracked in docs/data-access.md." },
  { ref = "7", summary = "StatsBomb owns the data.", handling = "No ownership claims and no redistribution." },
]
verified_url = "https://github.com/hudl/open-data"
verified_on = "2026-10-21"
notes = "Raw data and evidence stores are no_share; analyses derived from it are non_commercial and need the logo when published. Publishing a StatsBomb-based analysis needs a release step that keeps raw values and the evidence store private (ADR 0002, open point); until that exists nothing derived from it is published. Event-video alignment uses fixed per-half offsets (+1.91 s and +2.29 s; 25 of 27 shots within 0.15 s), an agreement between two manual annotations rather than an error against true contact frames."

