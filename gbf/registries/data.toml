license = "NONE"
rights_source = "None: a 67-second excerpt of a Stan Sport broadcast received through a messaging app; gbf holds no licence. Kept on the maintainer's machine for local regression tests only."
restrictions = ["no_share"]
allowed_uses = ["local_processing", "evaluation", "smoke_testing"]
aggregate_publication = "unverified"
committable = false
verified_on = "2026-10-21"
notes = "1920x1080, 25 fps; five hard cuts (prereg/README.md, erratum E1, gives their count and the weakest margin, and the sha256 of the private file that lists them); a 1,681-frame archive and 100 manual track labels (43 and 42 per team, 9 others, 6 two-people boxes) stay outside the repository. No event data can lawfully be paired with it. Never uploaded again to any service; whether the copy uploaded earlier to a private cloud dataset is deleted is the maintainer's decision (plan section 10). Besides its sha256 and integer regression thresholds (for example 82/85 tracks), aggregate statistics measured on it (medians, ratios, thresholds) appear in the repository as the provenance of tuned parameters, in docs/design/m1-highlights.md (\"Tuned parameters\") and in code docstrings (ADR 0002, amendment of 2026-10-21)."

