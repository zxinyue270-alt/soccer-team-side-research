[[datasets]]
id = "worldpose"
name = "WorldPose (ETH Zurich AIT; 2022 World Cup 3D poses)"
kind = "pose_3d"
status = "planned"
acquisition = "after_approval"
license = "LicenseRef-WorldPose-Terms"
rights_source = "ETH Zurich academic terms accepted with the application; the broadcast video is licensed separately by FIFA under the FIFA Content T&Cs, sent only after applying. The challenge page states CC BY-NC-SA, which conflicts with the ETH terms: the terms actually signed prevail."
restrictions = ["research_nc", "no_identity"]
allowed_uses = ["local_processing", "evaluation", "fitting"]
aggregate_publication = "unverified"
committable = false
clauses = [
  { ref = "Use", summary = "Non-commercial academic use only.", handling = "Tag research_nc; anything fitted on it goes into plugin-research-nc." },
  { ref = "Training", summary = "No training of models for commercial use.", handling = "Commercial builds never use parameters fitted on it (ADR 0002 rule 3)." },
  { ref = "Redistribution", summary = "No redistribution, including converted model parameters.", handling = "Never committed or uploaded; fitted tables and networks stay in plugin-research-nc." },
  { ref = "Identity", summary = "No identity recognition and no identity linking.", handling = "Tag no_identity: plugins switch off ReID, jersey OCR and event-to-identity binding (gate G19); publishing refuses identity fields; action strata use pose-derived labels only, never StatsBomb or PFF events." },
  { ref = "Termination", summary = "ETH may end access at any time.", handling = "Copies are listed so they can be deleted." },
]
verified_url = "https://eth-ait.github.io/WorldPoseDataset/"
verified_on = "2026-10-21"
notes = "Main route to external 3D ground truth. Its ground truth is 66-80 mm from Vicon, so no claim can be finer. Whether aggregates may be published is checked clause by clause after the terms arrive."

[[datasets]]
id = "fifa-skeletal-tracking-light-2026"
name = "FIFA Skeletal Tracking Light 2026 (Hugging Face inputs, Codabench challenge)"
kind = "pose_3d"
status = "rejected"
acquisition = "none"
license = "LicenseRef-FIFA-STL-2026-Terms"
rights_source = "Hugging Face application (auto-approved; shares the applicant's user name and e-mail with the dataset authors) plus FIFA competition terms. The licence tag says cc-by-2.0 while the page says non-commercial only; the FIFA Content T&Cs, which are not public, prevail in a conflict."
restrictions = ["research_nc", "no_identity"]
allowed_uses = []
aggregate_publication = "not_allowed"
committable = false
reasons = [
  "The Hugging Face data holds inputs only for 20 sequences (6 validation, 14 test): boxes, cameras with first-frame extrinsics only, and 25-joint skeletons estimated by SAM 3D Body. There is no video and no ground truth, so even the starter-kit baseline cannot run.",
  "Ground truth sits on the Codabench evaluation server; the test portal closed on 2026-04-30 (the validation portal is still open).",
  "Competition terms 9.a transfer all intellectual property in entries (results, algorithms, technical reports) to FIFA, which conflicts with releasing our own algorithms as open source; 8.c does not accept AI-generated work.",
  "Training-grade 3D ground truth is available through the WorldPose application, so it adds nothing.",
]
clauses = [
  { ref = "9.a", summary = "Entries' intellectual property (results, algorithms, technical reports) transfers to FIFA.", handling = "Do not apply and do not submit to Codabench." },
  { ref = "8.c", summary = "AI-generated work is not accepted.", handling = "Not applicable: not applying." },
]
verified_url = "https://huggingface.co/datasets/tijiang13/FIFA-Skeletal-Tracking-Light-2026"
verified_on = "2026-10-21"
notes = "82 files, 723 MB: boxes, cameras, 2D and 3D skeletons only (appendix B F1-F4)."

