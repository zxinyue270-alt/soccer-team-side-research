[[datasets]]
id = "soccernet-raw-hq"
name = "SoccerNet broadcast videos (SoccerNet_raw_HQ)"
kind = "broadcast_video"
status = "planned"
acquisition = "after_approval"
license = "LicenseRef-SoccerNet-NDA"
rights_source = "SoccerNet NDA signed electronically on Hugging Face and approved manually, separately for each repository; the counterparty is KAUST. Copyright in the footage stays with the leagues and broadcasters."
restrictions = ["nda"]
allowed_uses = ["local_processing", "evaluation", "fitting"]
aggregate_publication = "unverified"
committable = false
subset = ["england_epl/2015-2016/2015-10-03 - 17-00 Manchester City 6 - 1 Newcastle Utd (valid split): the demo match."]
clauses = [
  { ref = "Access form", summary = "Research and non-commercial use only; the videos are copyrighted; do not share them with anyone.", handling = "Tag nda on the videos and on every per-item derivative (detections, tracks, skeletons, crops); never published or uploaded." },
  { ref = "3.c", summary = "Disclosure only to representatives, advisers or subcontractors bound by equivalent confidentiality, or with written authorisation (not re-checked).", handling = "Local processing by default. Kaggle only with the maintainer's approval, no objection from SoccerNet and the NDA job rules of ADR 0002; question 1 of the e-mail in docs/data-access.md asks about cloud processing." },
  { ref = "Term", summary = "Confidentiality obligations last 2 years; Saudi law governs (pages 2-3 were not re-read; taken from the research record).", handling = "The NDA-derivatives inventory in docs/data-access.md is counted before P5 and before expiry." },
]
verified_url = "https://huggingface.co/datasets/SoccerNet/SoccerNet_raw_HQ"
verified_on = "2026-10-21"
notes = "224p (398x224) and 720p (1280x720), both 25 fps; resolution of the HQ originals not verified. On arrival check resolution, frame rate and frame count with ffprobe, then field_order and idet (2015 broadcasts may be interlaced). Keep the video directory outside synced folders. Questions 2 and 3 of the e-mail ask whether derived skeletons and coordinates may be published and whether watermarked private demos may be shown to named people."

[[datasets]]
id = "soccernet-gsr-2025"
name = "SoccerNet Game State Reconstruction 2025 (SN-GSR-2025)"
kind = "video_with_tracking_labels"
status = "planned"
acquisition = "download"
license = "GPL-3.0-only"
rights_source = "Hugging Face dataset card (gated=false) labels the dataset gpl-3.0. The footage comes from 2019 Swiss Super League broadcasts and belongs to the league or broadcaster; the GPL label is not a grant of rights in that footage."
restrictions = []
allowed_uses = ["local_processing", "cloud_processing", "evaluation", "fitting", "publish_aggregates"]
aggregate_publication = "allowed"
committable = false
verified_url = "https://huggingface.co/datasets/SoccerNet/SN-GSR-2025"
verified_on = "2026-10-21"
notes = "Publish numbers only, never frames. By default it does not train weights meant for release, and commercial builds do not use parameters fitted on it (ADR 0002 rule 3). 1920x1080, 25 fps, 30 s clips (750 frames); public labels for 57 train, 59 valid and 50 test clips plus a challenge set without public ground truth; archives train 9.8 GB, valid 11.2 GB, test 8.8 GB: extract only sampled clips. Single main camera, no cuts, ball removed from the labels; ground-truth positions are box bottoms projected with camera parameters computed from annotated line points, so frames with few lines may be poorly calibrated. Whether the test archive contains labels is unverified. Split and protocol: prereg/gates.v1.json."

