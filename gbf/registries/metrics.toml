# ---------------------------------------------------------------------------------
# A_candidate: 3D; 'unverified' until P4 measures it and it beats its 2D baseline
# ---------------------------------------------------------------------------------

[[metrics]]
id = "body-orientation"
name = "Body orientation to the attacked goal at own touch or reference frame"
tier = "A_candidate"
blocked = false
min_fps = 25
min_bbox_px = 80
thresholds_provisional = true
needs_fresh_calibration = true
needs_contact_frame = false
needs_ball_detection = false
two_d_baseline = "2D shoulder and hip keypoints combined with the camera's line of sight (after Arbués-Sangüesa)."
error_status = "unmeasured"
certified_by = ["worldpose"]
method = "Angle between the height-prior lifted facing and the direction to the attacked goal, using a circular mean over the player's own matched touch frame +/- 2 frames, else the player's reference frame. This is a 3D reference, not a verified body measurement."
limitations = "Needs a visible trunk, the box-height minimum, fresh calibration and the confidence, uncertainty and circular-resultant gates. A per-frame reversal check withholds a facing when the 2D hip-to-shoulder trunk exceeds FACING_LEAN_DEG toward one image side while the projected facing points to the other by at least FACING_SIDE_SHARE, or cannot be projected. Upright and near-depth directions pass this check only; missing hip/shoulder keypoints leave this check unavailable, and the other display gates still apply. The reference frame is reported and is not a confirmed contact. The receiver is often off screen, so coverage is always reported. 80 px is the current provisional display minimum and the coverage threshold of prereg/gates.v1.json; revisit it in gates v2 after the P1 benchmark."

[[metrics]]
id = "trunk-lean-at-contact"
name = "Signed trunk lean in degrees at own touch or reference frame"
tier = "A_candidate"
blocked = false
min_fps = 25
min_bbox_px = 80
thresholds_provisional = true
needs_fresh_calibration = true
needs_contact_frame = false
needs_ball_detection = false
two_d_baseline = "2D hip-midpoint-to-shoulder-midpoint line corrected for camera tilt and roll; valid only when the sagittal plane is close to parallel with the image plane, stratified by camera azimuth."
error_status = "unmeasured"
certified_by = ["worldpose"]
method = "Median signed sagittal trunk lean from the height-prior lift over the player's own matched touch frame +/- 2 frames, else the player's reference frame; reported as continuous degrees, positive forward. After its own box-height and lean-uncertainty gates, each row passes the shared 2D trunk versus projected-facing reversal check; rejected rows are excluded and counted. This adds no facing confidence or facing uncertainty gate to lean. The stable metric id is retained for compatibility; a reference frame is not a confirmed contact."
limitations = "Zero-shot SAM 3D Body already shows 7.7-9.0 cm local error on FIFA 1080p footage and 720p is worse, so the angle error exceeds the earlier +/- 5-10 degree estimate; any future categorical bin edges require P4 validation. Not reported without per-frame calibration (most replays). 'Leaning back sends the ball high' is coaching lore only."

# ---------------------------------------------------------------------------------
# B: experimental badge, bins and confidence only. General gate: box height >= 150 px
# (set after P1), bins of at least 15 degrees, and gate G12.
# ---------------------------------------------------------------------------------

[[metrics]]
id = "gk-stance-and-flexion"
name = "Goalkeeper stance width (wide bins) and knee and hip flexion"
tier = "B"
