# ---------------------------------------------------------------------------------
# A: trajectory level, with coverage and a sourced error reference
# ---------------------------------------------------------------------------------

[[metrics]]
id = "positions-trajectories"
name = "Positions and trajectories (top-down board)"
tier = "A"
blocked = false
min_fps = 25
min_bbox_px = 0
thresholds_provisional = false
needs_fresh_calibration = true
needs_contact_frame = false
needs_ball_detection = false
error_status = "unmeasured"
certified_by = ["soccernet-gsr-2025"]
literature = [
  "Crang 2026: RMSE 1.68-16.39 m for AI tracking from broadcast video.",
  "Linke 2018: 56 +/- 16 cm for a semi-automatic multi-camera system.",
]
method = "Box-bottom midpoint mapped to pitch metres with the frame's own homography; fresh-calibration frames only; tracks break at cuts; gaps of at most 5 frames inside one shot are interpolated and flagged; players outside the image are not drawn."
limitations = "The box bottom is not the foot. On screen the reference reads 'deviation relative to GSR annotations (reference)'."

[[metrics]]
id = "peak-speed"
name = "Peak speed within a clip"
tier = "A"
blocked = false
min_fps = 25
min_bbox_px = 0
thresholds_provisional = false
needs_fresh_calibration = true
needs_contact_frame = false
needs_ball_detection = false
error_status = "unmeasured"
certified_by = ["soccernet-gsr-2025"]
method = "Within one shot, on pitch-usable (fresh-calibration) frames: ground positions cleaned of box-size changes, local-median outliers and excursions from the local trend, and split where the trend jumps or the trends around a junction need more than 8 m/s^2 (gbf.kinematics); zero-phase smoothing (Savitzky-Golay) of each segment; speed = the chord of the smoothed positions centred on each frame over 0.4 s (10 frames at 25 fps; the card label states the chord's actual duration), valid where both chord ends are measured positions away from the segment ends in a segment of at least 1 s (25 frames); peak = the highest valid speed in the window, the same speeds the overlay labels and the sprint cue show. Withheld when valid speeds cover less than half of the frames the player was tracked on the pitch (leaving out the 10 frames at the start and end of the player's track in a shot, which no chord can cover), when the highest valid speed lies within half a chord of a stretch without valid speeds, or when the player crosses a gap in the track faster than it."
limitations = "Deviation measured peak to peak on GSR holdout clips with a confidence interval; stays conditional until an independent reference (for example optical tracking with video) exists, and the card states what the reference is. No acceleration and no full-match distance. Computing on a 105 x 68 m template scales the error with the real pitch size. The chord reads a sprint's 0.4 s mean, slightly below its instantaneous peak. Artefacts the cleaning keeps, measured on synthetic 6 s runs of 1-9 m/s (25 fps; noise per axis; figures with noise are the largest seen in the sample named, not bounds): an identity switch from one frame to the next stays up to 0.46 m on clean positions (0.72 m across 3 missing frames); with noise the largest seen to stay in 60 tracks per size (10 seeds x 6 runners) are 0.7 m with 5 cm, 0.95 m with 10 cm, 1.35 m with 20 cm and 1.45 m with 30 cm (1.05, 1.15, 1.4 and 1.6 m across 1-3 missing frames). A switch that stays adds up to 1.084 times its size over 0.4 s along the motion (1.25 m/s at 0.46 m), plus what the noise adds (in that sample up to 1.72, 2.27, 3.08 and 3.36 m/s in all with 5, 10, 20 and 30 cm, and 2.71, 2.89, 3.37 and 3.94 m/s across missing frames; another 5-seed x 6-runner sample per size and missing-frame count keeps 1.2 m at 10 cm and 1.45 m at 20 cm across missing frames, adding up to 2.97 and 3.40 m/s respectively); on clean positions a slide onto a neighbour slower than 1 m in 5 frames, 2 m in 13, 3 m in 17, 5 m in 21 or 8 m in 23 is kept (with noise some faster ones are kept too) and read as the slide's own speed on top of the player's (at most 2.7 % or 0.15 m/s more), bounded only by the 12 m/s plausibility limit (a 1 m/s jogger sliding 9.5 m in 24 frames reads 11.04 m/s), and so are the ramps of an excursion out and back (up to 5.7 m/s added); an out-and-back dip that stays adds up to 2.4 m/s on clean positions, also below 1 m (2.38 m/s at 0.99 m), and up to 2.57 m/s with 10 cm and 3.07 m/s with 20 cm of noise (12 tracks per size and length); two short dips of 1.05-2 m a few frames apart are rejected whole in 3127 of 3150 clean pairs (the others add up to 0.46 m/s) and add up to 2.19 m/s with 5-10 cm of noise (the largest seen in 6300 and 882 pairs per level), three 3-frame dips of 1.2 m 1-3 frames apart are not rejected whole and add up to 2.55 m/s, two dips below 1 m up to 1.94 m/s and two dips of which one lasts 4 frames up to 2.28 m/s (clean); noise alone raises a track's highest speed by a median of 0.4 m/s and at most 0.6 m/s per 10 cm."
fitted_parameters = [
  { name = "speed-smoothing", data_sources = ["soccernet-gsr-2025"], restrictions = [], note = "Zero-phase smoother shared with change-of-direction. Not fitted yet: gbf uses Savitzky-Golay window 11, order 2 with the 0.4 s chord, set during M1. The fit on GSR train clips that prereg/gates.v1.json asks for waits until v2 states its objective (prereg/README.md P1); evaluations declare this as deviation D1." },
]

