thresholds_provisional = true
needs_fresh_calibration = false
needs_contact_frame = true
needs_ball_detection = false
error_status = "unmeasured"
certified_by = []
method = "Ankle distance divided by leg length, with bin width set from the measured error; knee and hip flexion under the general B gate."
limitations = "The ankle is among the least accurate joints: for a stance of about 0.3 m the error can reach tens of percent."

[[metrics]]
id = "gk-set-position"
name = "Goalkeeper set before the shot"
tier = "B"
blocked = false
min_fps = 25
min_bbox_px = 150
thresholds_provisional = true
needs_fresh_calibration = true
needs_contact_frame = true
needs_ball_detection = false
error_status = "unmeasured"
certified_by = []
weak_label_sources = ["statsbomb-open-data"]
method = "2D cues: both feet on the ground, and the displacement of the smoothed box-bottom trajectory within a window of at least 0.5 s; agreement rate with StatsBomb goalkeeper position labels used as weak labels."
limitations = "Root velocity comes from ground anchoring, which cannot tell 'set' from small steps. Check the StatsBomb field names (Set, Moving, Prone) before use."

[[metrics]]
id = "save-type-direction"
name = "Save type and direction"
tier = "B"
blocked = false
min_fps = 25
min_bbox_px = 150
thresholds_provisional = true
needs_fresh_calibration = false
needs_contact_frame = true
needs_ball_detection = false
error_status = "unmeasured"
certified_by = []
weak_label_sources = ["statsbomb-open-data"]
method = "Classification of the 3D pose sequence; weak validation against StatsBomb goalkeeper technique labels (Diving, Standing; names to be checked)."
limitations = "A dive is exactly where ground anchoring is known to fail (SMART)."

[[metrics]]
id = "sagittal-flexion-snapshot"
name = "Sagittal-plane joint flexion snapshot (support knee, peak backswing knee, hip)"
tier = "B"
blocked = false
min_fps = 25
min_bbox_px = 150
thresholds_provisional = true
needs_fresh_calibration = false
needs_contact_frame = true
needs_ball_detection = false
error_status = "unmeasured"
certified_by = []
method = "Angles read from MHR segment rotation matrices on unsmoothed per-frame estimates. The small correction table of arXiv 2607.17639 is not applied until it is refitted on same-domain data."
limitations = "No published validation of joint angles from wide broadcast shots; joint errors of 5-9 cm imply roughly 7-13 degrees or more at knee and hip. WorldPose's own ground-truth noise is around 10 degrees (inferred), too coarse to judge 15-degree bins, so this is measured on the self-recorded reference instead (not yet registered)."

[[metrics]]
id = "striking-body-part"
name = "Striking body part (left foot, right foot, head)"
tier = "B"
blocked = false
min_fps = 25
min_bbox_px = 150
thresholds_provisional = true
needs_fresh_calibration = false
needs_contact_frame = true
needs_ball_detection = false
error_status = "unmeasured"
certified_by = []
weak_label_sources = ["statsbomb-open-data"]
method = "Relation between each foot and the ball, or the foot-speed peak; the head close to the ball counts as a header."
limitations = "The demo match has only 29 shots (StatsBomb: right foot 17, left foot 7, head 5), so agreement intervals are wide. They were already seen during P3 development; the P4 holdout uses the other 48 overlapping matches once the NDA covers them."

[[metrics]]
id = "pass-technique"
name = "Passing technique (inside-foot push or instep)"
tier = "B"
blocked = false
min_fps = 25
min_bbox_px = 150
thresholds_provisional = true
needs_fresh_calibration = false
needs_contact_frame = true
needs_ball_detection = false
