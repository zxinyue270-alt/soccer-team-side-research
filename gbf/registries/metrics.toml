# Metric registry (ADR 0004).
# Validated by src/gbf/contracts/schemas/registry_metrics.schema.json against the dict
# that tomllib.load returns.
#
# Every metric of plan section 4, plus the C tier of plan 1.1. Renderers, cards and
# narration consult this file: a C-tier metric is blocked everywhere, and a metric whose
# error_status is not "measured" or "provider" is shown as "unverified" and hidden from
# public builds.
#
# Conventions
# - tier: official | A | A_candidate | B | C (ADR 0004).
# - min_fps: lowest source frame rate the metric is defined and validated for. All
#   validation data is 25 fps, so video metrics start at 25. 0 = not applicable
#   (official values come from a provider; C metrics are blocked whatever the input).
# - min_bbox_px: minimum box height of the subject in source pixels; 0 = no
#   requirement or not applicable. A_candidate uses the 80 px coverage threshold and B
#   the 150 px general gate; both are candidates until the P1 benchmark
#   (thresholds_provisional = true; the 3D card minimum is set in gates v2).
# - needs_fresh_calibration: calibration computed on the frame itself (gate G6).
#   needs_contact_frame: a keyframe output that passed G14, or a manually confirmed
#   frame. needs_ball_detection: unavailable before ball detection is measured (P5).
#   Where the plan's prerequisite column is silent, these flags follow from the method.
# - error_status: provider (official only) | unmeasured | measured (with error_receipt).
# - certified_by: datasets whose results may certify the metric's error claim
#   (ADR 0004); weak_label_sources: labels that only give agreement rates.
# - fitted_parameters record their data sources and inherit those sources'
#   restrictions (ADR 0002 rule 3). Ids refer to registries/data.toml.

schema_version = 1

# ---------------------------------------------------------------------------------
# Official: provider values, shown with a source badge
# ---------------------------------------------------------------------------------

[[metrics]]
id = "shot-xg"
name = "Single-shot xG"
tier = "official"
blocked = false
min_fps = 0
min_bbox_px = 0
thresholds_provisional = false
needs_fresh_calibration = false
needs_contact_frame = false
needs_ball_detection = false
error_status = "provider"
data_sources = ["statsbomb-open-data", "idsse"]
certified_by = []
method = "Read shot.statsbomb_xg (demo match) or the IDSSE official xG; claimType provider_model; two decimals; a running total ('xG so far') stores its formula and operands."
limitations = "A provider's model output, never compared with other providers' xG. Event-video alignment: 25 of 27 shots within 0.15 s, the other 2 used only after manual confirmation. StatsBomb values: no redistribution, non-commercial, logo on publication."

