[project]
name = "gbf"
version = "0.0.1"
description = "Event-window technique analysis for football broadcasts, with an evidence trail for every number (working name gbf)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17",
    "jsonschema>=4.23",
    "pillow>=10.4",
    "kloppy>=3.15",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.scripts]
gbf = "gbf.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
pose = [
    "onnxruntime>=1.20",
    "rtmlib>=0.0.16",
]

[tool.uv]
# The pose group (rtmlib + onnxruntime, both permissive; rtmlib pulls opencv wheels that
# bundle LGPL FFmpeg) is installed by default so the pose tests never have to skip.
default-groups = ["dev", "pose"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers -ra"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# S101: no assert for runtime validation in library code (it vanishes under python -O).
# TID251: banned APIs, see below.
select = ["E", "F", "W", "I", "B", "UP", "PT", "S101", "TID251"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["gbf"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"cv2.imread".msg = "OpenCV image IO fails silently on non-ASCII paths; use gbf.util.io.read_image_rgb (Pillow)."
"cv2.imwrite".msg = "OpenCV image IO fails silently on non-ASCII paths; use gbf.util.io.write_image_png (Pillow)."
"warnings.filterwarnings".msg = "No global warning filters in project code; they hid a real pandas deprecation in sn-gamestate. Scope it and add a justified noqa."
"warnings.simplefilter".msg = "No global warning filters in project code; scope it inside warnings.catch_warnings() and add a justified noqa."
"pickle".msg = "Pickle is not an artifact format here (ADR 0003); use parquet, npz with allow_pickle=False, or JSON."
"cv2.VideoCapture".msg = "Read frames only through gbf.ingest.iter_frames / read_frames (ADR 0003, gate G5); OpenCV seeking caused the idx-1 bug in tracklab."
