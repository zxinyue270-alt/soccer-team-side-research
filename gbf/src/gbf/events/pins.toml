# Pinned open-data sources for the demo match.
#
# StatsBomb match 3754079 is the SoccerNet game
# "england_epl/2015-2016/2015-10-03 - 17-00 Manchester City 6 - 1 Newcastle Utd".
#
# Every value below is metadata read on 2026-10-21 from the GitHub git trees API
# (hudl/open-data, formerly statsbomb/open-data) and the Hugging Face tree API
# (SoccerNet/SN-Labels). No file content was downloaded to write this file.
# `python -m gbf fetch` checks each download against `bytes` and `git_blob_sha1`
# (git's blob id: sha1 of "blob <size>\0" + content) before it writes anything,
# and only ever writes under DATA_ROOT, outside the repository (ADR 0002).
#
# URLs are derived from host + repository + revision + path, so a pin cannot point
# at a different revision than the one it names:
#   github     -> https://raw.githubusercontent.com/<repository>/<revision>/<path>
#   hf-dataset -> https://huggingface.co/datasets/<repository>/resolve/<revision>/<path>

schema_version = 1

[terms.statsbomb]
title = "StatsBomb Public Data User Agreement"
# LICENSE.pdf at the pinned commit (git blob below, 165130 bytes).
agreement_url = "https://github.com/hudl/open-data/blob/4b73468fc5b0f1950f9f66fada70ad3a4f9327cb/LICENSE.pdf"
agreement_git_blob_sha1 = "66c0b4be6bf38b720d347bb140d70b9c47d9a676"
# Short summary of the clauses this project relies on. It is not the agreement:
# read the agreement itself before accepting it.
clauses = [
    "1.2.1  Do not provide the data to any third party, in any form.",
    "1.2.2  Do not exploit the data, or analyses derived from it, commercially.",
    "1.4    Publications that use the data must show the StatsBomb logo.",
    "2.2    Users must register with StatsBomb before using the data.",
]

